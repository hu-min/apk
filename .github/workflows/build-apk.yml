name: Build Android APK

# 触发方式：推送到 main 自动构建；也可在 Actions 页面手动 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1) 取出本仓库（含根目录的 ProductionApp.zip）
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 安装 JDK 17（AGP 8.3 必需）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3) 安装并配置 Android SDK（自动设置 ANDROID_HOME）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4) 安装编译所需的 SDK 平台 / 构建工具，并接受许可协议
      - name: Install SDK platform & build-tools, accept licenses
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      # 5) 解压源码，并自动定位工程根目录（兼容任意压缩包顶层目录名）
      - name: Unzip ProductionApp source
        run: |
          mkdir -p src
          unzip -o ProductionApp.zip -d src
          echo "PROJECT_DIR=$(find src -name settings.gradle -exec dirname {} \; | head -1)" >> "$GITHUB_ENV"

      # 6) 手动安装 Gradle 8.5（工程未含 gradle-wrapper.jar，不能走 ./gradlew）
      - name: Install Gradle 8.5
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -o gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.5/bin" >> "$GITHUB_PATH"

      # 7) 构建 Debug APK（自带 debug 签名，无需额外配置；功能与 Release 一致）
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      # 8) 把生成的 APK 作为构建产物上传，可在 Actions 页面下载
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-app-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      # ===== 可选：改为构建可上架的 Release 签名包 =====
      # 1. 在仓库 Settings → Secrets 添加：KEYSTORE_BASE64（keystore 文件 base64）、
      #    KEY_ALIAS、KEY_PASSWORD、STORE_PASSWORD
      # 2. 把第 7 步的参数改为 assembleRelease，并在 app/build.gradle 的 signingConfigs 中引用上述 secrets
      # 3. 第 8 步 path 改为 app/build/outputs/apk/release/app-release.apk
